name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build ZIP
        run: |
          zip -r "Gulce_AdminPower_v${{ steps.version.outputs.version }}.zip" . \
            -x "*.git*" \
            -x ".github/*" \
            -x "*.md" \
            -x "LICENSE" \
            -x ".gitignore"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Gulce_AdminPower v${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## Gulce_AdminPower v${{ steps.version.outputs.version }}

            Vanilla AdminPower datapack for Minecraft Java Edition 1.21.6+.

            ### Installation
            1. Download the ZIP below.
            2. Place it in your world's `datapacks/` folder.
            3. Restart the world or run `/reload`.

            ### Changelog
            See `README.md` (included in the pack) for full documentation and API reference.
          files: "Gulce_AdminPower_v${{ steps.version.outputs.version }}.zip"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
